<style>
  :root{
    --bg:#14132B;
    --bg-deep:#0E0D22;
    --card:#211F49;
    --card2:#2A2760;
    --line:#3A3776;
    --coral:#FF5D73;
    --coral-dk:#E23F58;
    --lime:#C6FF3D;
    --gold:#FFC94A;
    --cyan:#4FD8EA;
    --violet:#9C8CFF;
    --text:#FFFFFF;
    --text-dim:#B7B3E6;
    --text-faint:#7A76B0;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --radius-pill:999px;
    --shadow-pop: 0 10px 0 rgba(0,0,0,0.22);
    --font-display:'Fredoka', system-ui, sans-serif;
    --font-body:'Nunito', system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 15% -10%, #241F5E 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; margin:0;}
  p{margin:0;}
  button{font-family:var(--font-body); border:none; cursor:pointer; -webkit-appearance:none; appearance:none;}
  input{font-family:var(--font-body);}
  ::selection{background:var(--lime); color:#14132B;}
  #app{max-width:560px; margin:0 auto; min-height:100vh; padding-bottom:96px; position:relative;}
  .screen{padding:20px 18px 12px; animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @keyframes popIn{from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);}}
  @keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  @keyframes wiggle{0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-4deg);} 75%{transform:rotate(4deg);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);}}
  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(198,255,61,.55);} 100%{box-shadow:0 0 0 22px rgba(198,255,61,0);}}
  @keyframes spinSlow{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg);} 50%{transform:scale(1.08) rotate(2deg);}}

  /* --- Buttons --- */
  .btn{
    font-family:var(--font-display); font-weight:600; font-size:17px;
    padding:16px 22px; border-radius:var(--radius-pill);
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    transition:transform .12s ease, box-shadow .12s ease; user-select:none;
    min-height:56px;
  }
  .btn:active{transform:translateY(3px); box-shadow:none !important;}
  .btn-primary{background:var(--lime); color:#132; color:#14231A; box-shadow:var(--shadow-pop); box-shadow:0 6px 0 #7FA820;}
  .btn-coral{background:var(--coral); color:#fff; box-shadow:0 6px 0 var(--coral-dk);}
  .btn-gold{background:var(--gold); color:#3A2400; box-shadow:0 6px 0 #C99328;}
  .btn-cyan{background:var(--cyan); color:#053238; box-shadow:0 6px 0 #2CA9B9;}
  .btn-ghost{background:var(--card2); color:var(--text); box-shadow:0 6px 0 #161447;}
  .btn-outline{background:transparent; color:var(--text-dim); border:2px solid var(--line); box-shadow:none; min-height:48px;}
  .btn-block{width:100%;}
  .btn-sm{min-height:42px; padding:10px 16px; font-size:14px; box-shadow:0 4px 0 rgba(0,0,0,.22);}
  .btn:disabled{opacity:.4; pointer-events:none;}

  /* --- Generic bits --- */
  .card{background:var(--card); border-radius:var(--radius-lg); padding:18px; border:2px solid rgba(255,255,255,0.04);}
  .muted{color:var(--text-dim);}
  .faint{color:var(--text-faint); font-size:13px;}
  .row{display:flex; align-items:center;}
  .between{justify-content:space-between;}
  .gap8{gap:8px;} .gap10{gap:10px;} .gap12{gap:12px;} .gap16{gap:16px;}
  .center{display:flex; align-items:center; justify-content:center;}
  .stack{display:flex; flex-direction:column;}
  .pill{border-radius:var(--radius-pill); padding:6px 14px; font-weight:800; font-size:13px; display:inline-flex; align-items:center; gap:6px;}
  .hidden{display:none !important;}
  .logo-wrap{display:flex; align-items:center; gap:10px;}
  .logo-badge{width:46px; height:46px; border-radius:16px; background:linear-gradient(145deg, var(--coral), var(--gold)); display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 6px 0 rgba(0,0,0,.25); animation:floaty 3.2s ease-in-out infinite;}

  /* --- Top bar --- */
  .topbar{position:sticky; top:0; z-index:30; backdrop-filter:blur(10px); background:rgba(20,19,43,0.86); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid rgba(255,255,255,0.05);}
  .icon-btn{width:44px; height:44px; border-radius:14px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:20px;}

  /* --- Bottom tabs (parent) --- */
  .tabbar{position:fixed; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; background:var(--card); border-top:2px solid var(--line); display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom)); z-index:40; border-radius:24px 24px 0 0;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px; border-radius:16px; color:var(--text-faint); font-size:11px; font-weight:800;}
  .tab.active{color:var(--lime); background:rgba(198,255,61,0.08);}
  .tab .ic{font-size:21px;}

  /* --- Onboarding --- */
  .hero{text-align:center; padding:26px 6px 6px;}
  .hero .mascot{font-size:74px; display:block; margin:0 auto 6px; animation:floaty 3s ease-in-out infinite;}
  .hero h1{font-size:30px; line-height:1.15;}
  .choice-card{background:var(--card); border-radius:var(--radius-lg); padding:20px; border:2px solid var(--line); display:flex; align-items:center; gap:14px; transition:transform .12s ease;}
  .choice-card:active{transform:scale(.97);}
  .choice-card .em{font-size:36px;}
  .field{background:var(--card2); border:2px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; color:var(--text); font-size:16px; width:100%; font-weight:700;}
  .field::placeholder{color:var(--text-faint); font-weight:600;}
  .field:focus{outline:none; border-color:var(--lime);}
  label.flabel{font-size:13px; font-weight:800; color:var(--text-dim); margin-bottom:6px; display:block;}

  .code-display{font-family:var(--font-display); letter-spacing:8px; font-size:38px; text-align:center; background:var(--card2); border-radius:var(--radius-md); padding:18px 10px; border:3px dashed var(--violet); color:var(--gold);}

  /* --- Avatar grid --- */
  .avatar-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  .avatar-opt{aspect-ratio:1; border-radius:18px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:28px; border:3px solid transparent;}
  .avatar-opt.sel{border-color:var(--lime); background:rgba(198,255,61,.12);}

  /* --- PIN pad --- */
  .pin-dots{display:flex; gap:14px; justify-content:center; margin:18px 0;}
  .pin-dot{width:18px; height:18px; border-radius:50%; background:var(--card2); border:2px solid var(--line);}
  .pin-dot.filled{background:var(--lime); border-color:var(--lime);}
  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .pin-key{aspect-ratio:1; border-radius:20px; background:var(--card2); color:var(--text); font-family:var(--font-display); font-size:24px; font-weight:600; display:flex; align-items:center; justify-content:center;}
  .pin-key:active{background:var(--card);}

  /* --- Modal --- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(6,5,20,0.72); display:flex; align-items:flex-end; justify-content:center; z-index:100; animation:fadeUp .18s ease;}
  .modal-sheet{background:var(--bg); width:100%; max-width:560px; border-radius:28px 28px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; animation:popIn .22s ease; border-top:3px solid var(--line);}
  .modal-handle{width:44px; height:5px; background:var(--line); border-radius:99px; margin:0 auto 14px;}

  /* --- Child dashboard --- */
  .points-banner{background:linear-gradient(135deg, var(--card2), var(--card)); border-radius:var(--radius-lg); padding:18px 20px; border:2px solid var(--line); position:relative; overflow:hidden;}
  .points-banner .coin{font-size:34px;}
  .points-num{font-family:var(--font-display); font-size:34px; color:var(--gold);}
  .streak-row{display:flex; align-items:center; gap:10px; margin-top:12px; background:rgba(0,0,0,.18); border-radius:16px; padding:10px 14px;}
  .flame{font-size:26px; display:inline-block;}
  .flame.lv3{animation:flicker 1.1s ease-in-out infinite;}
  .streak-track{flex:1; height:10px; border-radius:99px; background:var(--bg-deep); overflow:hidden;}
  .streak-fill{height:100%; border-radius:99px; background:linear-gradient(90deg, var(--coral), var(--gold)); transition:width .5s ease;}

  .section-title{font-size:20px; margin:22px 0 12px; display:flex; align-items:center; gap:8px;}

  .task-card{background:var(--card); border-radius:var(--radius-lg); border:2px solid var(--line); padding:16px; display:flex; align-items:center; gap:14px; margin-bottom:12px; transition:transform .1s ease;}
  .task-card.done{opacity:.55;}
  .task-card.pending{border-color:var(--gold);}
  .task-card.rejected{border-color:var(--coral);}
  .task-ic{width:56px; height:56px; border-radius:16px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0;}
  .task-body{flex:1; min-width:0;}
  .task-title{font-family:var(--font-display); font-size:17px; font-weight:600;}
  .task-pts{color:var(--gold); font-weight:800; font-size:13px;}
  .task-actions{display:flex; flex-direction:column; gap:6px; align-items:center;}
  .sound-btn{width:44px; height:44px; border-radius:50%; background:var(--card2); font-size:19px; display:flex; align-items:center; justify-content:center;}
  .sound-btn:active{background:var(--cyan); }
  .check-btn{width:52px; height:52px; border-radius:50%; background:var(--lime); font-size:24px; display:flex; align-items:center; justify-content:center; box-shadow:0 5px 0 #7FA820;}
  .check-btn:active{transform:translateY(4px); box-shadow:none;}
  .status-chip{font-size:11px; font-weight:800; padding:5px 10px; border-radius:99px;}

  .reward-scroll{display:flex; gap:14px; overflow-x:auto; padding:4px 2px 14px; scroll-snap-type:x mandatory;}
  .reward-card{scroll-snap-align:start; flex:0 0 148px; background:var(--card); border-radius:var(--radius-lg); border:2px solid var(--line); padding:16px 12px; text-align:center;}
  .reward-em{font-size:40px; display:block; margin-bottom:6px;}
  .reward-title{font-family:var(--font-display); font-size:15px; margin-bottom:2px;}
  .reward-cost{color:var(--gold); font-weight:800; font-size:14px; margin-bottom:10px;}

  .empty-box{text-align:center; padding:34px 16px; color:var(--text-faint);}
  .empty-box .em{font-size:44px; display:block; margin-bottom:8px;}

  .approval-card{background:var(--card); border-radius:var(--radius-lg); border:2px solid var(--gold); padding:16px; margin-bottom:12px; display:flex; align-items:center; gap:12px;}
  .child-badge{width:40px; height:40px; border-radius:12px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:20px;}

  .toast{position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--card2); border:2px solid var(--lime); color:var(--text); padding:12px 20px; border-radius:99px; font-weight:800; z-index:200; box-shadow:0 8px 20px rgba(0,0,0,.4); animation:popIn .25s ease; display:flex; align-items:center; gap:8px; max-width:90%;}

  canvas#confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:150;}

  .emoji-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin:10px 0 4px;}
  .emoji-opt{aspect-ratio:1; border-radius:14px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:22px; border:2px solid transparent;}
  .emoji-opt.sel{border-color:var(--lime);}

  .chip-select{display:flex; flex-wrap:wrap; gap:8px;}
  .chip-opt{padding:10px 16px; border-radius:99px; background:var(--card2); font-weight:800; font-size:13px; border:2px solid transparent;}
  .chip-opt.sel{border-color:var(--lime); color:var(--lime); background:rgba(198,255,61,.1);}

  .switch-row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px;}
  .fab{position:fixed; right:18px; bottom:104px; z-index:35; width:60px; height:60px; border-radius:50%; background:var(--coral); box-shadow:0 8px 0 var(--coral-dk); font-size:28px; display:flex; align-items:center; justify-content:center;}

  a{color:var(--cyan);}
  .qr-frame{position:relative; width:220px; height:220px; margin:14px auto; border-radius:24px; background:repeating-linear-gradient(45deg, var(--card2), var(--card2) 10px, var(--bg-deep) 10px, var(--bg-deep) 20px); display:flex; align-items:center; justify-content:center; border:4px solid var(--violet);}
  .qr-frame .corner{position:absolute; width:34px; height:34px; border:5px solid var(--gold);}
  .qr-frame .c1{top:8px; left:8px; border-right:none; border-bottom:none;}
  .qr-frame .c2{top:8px; right:8px; border-left:none; border-bottom:none;}
  .qr-frame .c3{bottom:8px; left:8px; border-right:none; border-top:none;}
  .qr-frame .c4{bottom:8px; right:8px; border-left:none; border-top:none;}
  .qr-frame .big-code{font-family:var(--font-display); font-size:15px; letter-spacing:3px; background:var(--bg-deep); padding:10px 12px; border-radius:12px; color:var(--gold);}

  @media (max-width:360px){
    .points-num{font-size:28px;}
    .task-title{font-size:15px;}
  }
</style>

<script>
/* ============================================================

// ---------- Config ----------
const SUPABASE_URL = 'https://mnkpfnofxbotmsmhcody.supabase.co';
const SUPABASE_KEY = 'sb_publishable_qHVqodo_YM0jje44zbhhOw_6NmYu7zN';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const AVATARS = ['🦊','🐼','🐵','🐯','🦁','🐸','🐙','🦄','🐲','🐰','🐨','🐷'];
const TASK_ICONS = ['⭐','🦷','🛏️','🎒','🍽️','🧸','📚','🐶','🧹','🚿','👕','🌱','🗑️','✏️','🧦','🥦'];
const REWARD_ICONS = ['🍦','🎮','🍿','🎬','🧁','🚲','🏊','🎨','🪁','🎟️','🧃','🍩','🕹️','🎪','⚽','🛴'];

// ---------- Small utils ----------
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const el = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const todayStr = () => new Date().toISOString().slice(0,10);
const genId = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }));
function genFamilyCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];

}
function ls_get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function ls_set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function ls_del(k){ try{ localStorage.removeItem(k); }catch(e){} }
function ss_get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ss_set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
function fmtDatePt(d){

}

// ---------- Sound (Web Audio synth — sem arquivos externos) ----------
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq, start, dur, type='sine', vol=0.18){
  const ctx = getAudioCtx(); if(!ctx) return;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, ctx.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, ctx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+start+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(ctx.currentTime+start); o.stop(ctx.currentTime+start+dur+0.05);
}
function playClick(){ tone(720,0,0.06,'square',0.08); }
function playSuccess(){ tone(523,0,0.12); tone(659,0.09,0.12); tone(784,0.18,0.22); }
function playCoin(){ tone(988,0,0.08,'square',0.12); tone(1318,0.06,0.16,'square',0.12); }
function playLevelUp(){ tone(523,0,0.1); tone(659,0.1,0.1); tone(784,0.2,0.1); tone(1047,0.3,0.3); }
function playGentleNo(){ tone(300,0,0.15,'sine',0.10); tone(220,0.12,0.2,'sine',0.10); }
function playWhoosh(){ tone(200,0,0.18,'sawtooth',0.06); }

// ---------- Voz (Web Speech API) ----------
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-BR'; u.rate = 0.95; u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

// ---------- Confetti (canvas puro) ----------
const confettiCanvas = document.getElementById('confetti-canvas');
const cctx = confettiCanvas.getContext('2d');
function resizeConfetti(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
resizeConfetti(); addEventListener('resize', resizeConfetti);
let confettiParticles = [];
let confettiRAF = null;
function confettiBurst(opts={}){
  const count = opts.count || 90;
  const colors = opts.colors || ['#FF5D73','#FFC94A','#C6FF3D','#4FD8EA','#9C8CFF'];
  const originY = opts.originY || innerHeight*0.25;
  for(let i=0;i<count;i++){
    confettiParticles.push({
      x: innerWidth/2 + (Math.random()-0.5)*160,
      y: originY + (Math.random()-0.5)*40,
      vx: (Math.random()-0.5)*9,
      vy: -Math.random()*11 - 4,
      size: Math.random()*7+4,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      vrot: (Math.random()-0.5)*14,
      shape: Math.random()>0.5?'rect':'circle',
      life: 0, maxLife: 110+Math.random()*40
    });
  }
  if(!confettiRAF) confettiLoop();
}
function confettiLoop(){
  cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  confettiParticles.forEach(p=>{
    p.vy += 0.32; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
    cctx.save();
    cctx.translate(p.x, p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    cctx.fillStyle = p.color;
    if(p.shape==='rect') cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    else { cctx.beginPath(); cctx.arc(0,0,p.size/2,0,Math.PI*2); cctx.fill(); }
    cctx.restore();
  });
  confettiParticles = confettiParticles.filter(p=>p.life < p.maxLife && p.y < confettiCanvas.height+40);
  if(confettiParticles.length>0){ confettiRAF = requestAnimationFrame(confettiLoop); }
  else { confettiRAF = null; cctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height); }
}

// ---------- Toast ----------
function showToast(msg, ms=2600){
  const root = $('#toast-root');
  root.innerHTML = '';
  const t = el(`<div class="toast">${msg}</div>`);
  root.appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.remove(); }, ms);
}

// ---------- Estado global ----------
const state = {
  loading: true,
  family: null,
  children: [],
  tasks: [],
  rewards: [],
  completions: [],     // pendentes de todas as datas + de hoje

// ---------- Lógica de streak ----------
// Regras:
//  - dias consecutivos (fim de semana não quebra: sexta -> segunda conta como seguido)
//  - 0-2 dias seguidos = nível 1 · 3-4 dias = nível 2 · 5+ dias = nível 3 (máximo, bônus x1,1)
//  - se quebrar estando no nível 3 -> cai para o nível 2 (não perde tudo)
//  - se quebrar estando no nível 2 -> cai para o nível 1
//  - se quebrar estando no nível 1 -> recomeça no nível 1
function isConsecutiveDay(lastDateStr, todayDateStr){
  if(!lastDateStr) return false;
  const last = new Date(lastDateStr+'T00:00:00');
  const today = new Date(todayDateStr+'T00:00:00');
  const diffDays = Math.round((today-last)/86400000);
  if(diffDays === 1) return true;
  if(diffDays === 3 && today.getDay()===1 && last.getDay()===5) return true; // sexta -> segunda
  return false;
}
function levelForDays(days){ return days>=5 ? 3 : (days>=3 ? 2 : 1); }
function computeStreakOnApproval(child, todayD){
  // retorna { streak_days, streak_level, last_task_date, multiplier, leveledUp, sameDay }
  if(child.last_task_date === todayD){
    return { streak_days: child.streak_days, streak_level: child.streak_level, last_task_date: todayD,
      multiplier: child.streak_level===3?1.1:1.0, leveledUp:false, sameDay:true };
  }
  let newDays;
  const continued = isConsecutiveDay(child.last_task_date, todayD);
  if(continued){
    newDays = (child.streak_days||0) + 1;
  } else if(child.streak_level === 3){
    newDays = 4; // cai para o topo do nível 2, preserva parte do progresso
  } else {
    newDays = 1; // recomeça contando hoje
  }
  const newLevel = levelForDays(newDays);
  return {
    streak_days: newDays, streak_level: newLevel, last_task_date: todayD,
    multiplier: newLevel===3?1.1:1.0, leveledUp: newLevel > child.streak_level, sameDay:false
  };
}

// ---------- Ações: cumprir tarefa (criança) ----------
function getCompletionFor(taskId, childId, date){
  return state.completions.find(c=>c.task_id===taskId && c.child_id===childId && c.task_date===date);
}
async function submitTaskDone(taskId, childId){
  const today = todayStr();
  const existing = getCompletionFor(taskId, childId, today);
  if(existing && existing.status!=='rejected'){ return; }
  let row;
  if(existing){
    const { data, error } = await sb.from('task_completions')
      .update({ status:'pending', submitted_at:new Date().toISOString(), resolved_at:null })
      .eq('id', existing.id).select().single();
    if(error){ console.error(error); return; }
    row = data;
  } else {
    const { data, error } = await sb.from('task_completions').insert({
      task_id: taskId, child_id: childId, family_id: state.family.id, task_date: today, status:'pending'
    }).select().single();
    if(error){ console.error(error); return; }
    row = data;
  }
  const idx = state.completions.findIndex(c=>c.id===row.id);
  if(idx>=0) state.completions[idx]=row; else state.completions.push(row);
  playWhoosh();
  showToast('📨 Enviado pro responsável aprovar!');
  render();
}

// ---------- Ações: aprovação (responsável) ----------
async function approveCompletion(completionId){
  const completion = state.completions.find(c=>c.id===completionId);
  if(!completion) return;
  const task = state.tasks.find(t=>t.id===completion.task_id);
  const child = state.children.find(c=>c.id===completion.child_id);
  if(!task || !child) return;
  const today = todayStr();
  const streakUpd = computeStreakOnApproval(child, today);
  const pointsAwarded = Math.round((task.points||0) * streakUpd.multiplier);

  const { error: e1 } = await sb.from('task_completions').update({
    status:'approved', points_awarded: pointsAwarded, resolved_at: new Date().toISOString()
  }).eq('id', completionId);
  const { error: e2 } = await sb.from('children').update({
    points: child.points + pointsAwarded,
    streak_days: streakUpd.streak_days,
    streak_level: streakUpd.streak_level,
    last_task_date: streakUpd.last_task_date
  }).eq('id', child.id);
  if(task.frequency === 'once'){ await sb.from('tasks').update({ active:false }).eq('id', task.id); task.active=false; }
  if(e1||e2){ showToast('😕 Algo deu errado.'); console.error(e1,e2); return; }

  completion.status='approved'; completion.points_awarded = pointsAwarded;
  child.points += pointsAwarded; child.streak_days = streakUpd.streak_days;
  child.streak_level = streakUpd.streak_level; child.last_task_date = streakUpd.last_task_date;

  render();
  confettiBurst({count:70});
  if(streakUpd.leveledUp){
    playLevelUp();
    setTimeout(()=>showToast(`🔥 ${child.name} subiu pro nível ${streakUpd.streak_level} de streak!`, 3200), 200);
  } else {
    playSuccess();
    showToast(`✅ Tarefa aprovada! +${pointsAwarded} pontos pra ${child.name}`);
  }
}
async function rejectCompletion(completionId){
  const completion = state.completions.find(c=>c.id===completionId);
  if(!completion) return;
  await sb.from('task_completions').update({ status:'rejected', resolved_at:new Date().toISOString() }).eq('id', completionId);
  completion.status='rejected';
  playGentleNo();
  showToast('↩️ Marcado como não concluída.');
  render();
}

// ---------- Ações: resgate de prêmios (criança) ----------
async function redeemReward(rewardId){
  const reward = state.rewards.find(r=>r.id===rewardId);
  const child = state.children.find(c=>c.id===state.activeChildId);
  if(!reward || !child) return;
  if(child.points < reward.cost){ playGentleNo(); showToast('🪙 Ainda faltam pontos pra esse prêmio!'); return; }
  const { data, error } = await sb.from('redemptions').insert({
    reward_id: reward.id, child_id: child.id, family_id: state.family.id, cost: reward.cost, status:'pending'
  }).select().single();
  if(error){ showToast('😕 Não deu pra resgatar.'); console.error(error); return; }
  await sb.from('children').update({ points: child.points - reward.cost }).eq('id', child.id);
  child.points -= reward.cost;
  state.redemptions.unshift(data);
  confettiBurst({count:130, colors:['#FFC94A','#FF5D73','#C6FF3D','#4FD8EA']});
  playCoin();
  showToast(`🎉 ${reward.icon} resgatado! Avisa o responsável.`, 3200);
  render();
}
async function markDelivered(redemptionId){
  const r = state.redemptions.find(r=>r.id===redemptionId);
  if(!r) return;
  await sb.from('redemptions').update({ status:'delivered', delivered_at:new Date().toISOString() }).eq('id', redemptionId);
  r.status='delivered'; r.delivered_at=new Date().toISOString();
  playSuccess();
  showToast('📦 Entrega registrada!');
  render();
}

  $$('#pin-dots .pin-dot').forEach((d,i)=> d.classList.toggle('filled', i < window._pinBuffer.length));
}

  if(window._pinBuffer === state.family.parent_pin){
    const cb = window._pinSuccess;
    closeModal();

  } else {
    playGentleNo();
    const err = $('#pin-error'); if(err) err.textContent = 'Senha incorreta, tente de novo';
    const dotsEl = $('#pin-dots');
    if(dotsEl){ dotsEl.style.animation='shake .4s ease'; setTimeout(()=>{ dotsEl.style.animation=''; }, 400); }
    window._pinBuffer='';
    updatePinDots();
  }
}

// ---------- Navegação ----------
function goTo(screen){ state.screen = screen; render(); }

function decidePostFamilyFlow(){
  if(state.children.length===0 && !state.deviceMode){ state.screen='addFirstChild'; render(); return; }
  if(!state.deviceMode){ state.screen='deviceMode'; render(); return; }
  if(state.deviceMode==='dual-child'){
    if(!state.deviceChildId || !state.children.find(c=>c.id===state.deviceChildId)){ state.screen='childDevicePick'; render(); return; }
    state.activeChildId = state.deviceChildId; state.role='child'; state.screen='app'; render(); return;
  }
  if(state.deviceMode==='dual-parent'){ state.role='parent'; state.screen='app'; render(); return; }
  // aparelho único (compartilhado)
  const savedRole = ss_get('mf_last_role');
  if(savedRole==='parent' && ss_get('mf_parent_unlocked')==='1'){ state.role='parent'; state.parentUnlocked=true; state.screen='app'; render(); return; }
  if(savedRole==='child'){ state.role='child'; state.activeChildId = state.children.length===1 ? state.children[0].id : null; state.screen='app'; render(); return; }
  state.screen='roleGate'; render();
}
function chooseDeviceMode(mode){
  state.deviceMode = mode; ls_set('mf_device_mode', mode);
  playClick();
  decidePostFamilyFlow();
}
function pickDeviceChild(id){
  state.deviceChildId = id; ls_set('mf_device_child_id', id);
  playSuccess();
  decidePostFamilyFlow();
}
function chooseRole(role){
  if(role==='parent'){
    openPinModal('Entrar como responsável', ()=>{
      state.parentUnlocked = true; ss_set('mf_parent_unlocked','1'); ss_set('mf_last_role','parent');
      state.role = 'parent'; state.screen = 'app'; render();
    });
  } else {
    ss_set('mf_last_role','child');
    state.role = 'child';
    state.activeChildId = state.children.length===1 ? state.children[0].id : null;
    state.screen = 'app'; render();
  }
}

  sessionStorage.removeItem('mf_last_role'); sessionStorage.removeItem('mf_parent_unlocked');

async function submitAddTask(){
  const title = $('#task-title').value.trim();
  const points = Math.max(1, parseInt($('#task-points').value) || 10);
  const childBtn = $('#task-child-chips .chip-opt.sel');
  const freqBtn = $('#task-freq-chips .chip-opt.sel');
  if(!title){ showToast('Escreve o nome da tarefa 🙂'); return; }
  await addTask({ title, icon: state.tempIcon, points, child_id: (childBtn && childBtn.dataset.val) || null, frequency: (freqBtn && freqBtn.dataset.val) || 'daily' });
  closeModal(); playSuccess(); showToast('📋 Tarefa criada!'); render();
}

function childTaskCard(t, child){
  const today = todayStr();
  const c = getCompletionFor(t.id, child.id, today);
  const status = c ? c.status : 'none';
  let cardClass = 'task-card', rightBtn = '';
  if(status==='approved'){
    cardClass += ' done';
    rightBtn = `<span class="status-chip" style="background:rgba(198,255,61,.15);color:var(--lime);">Feito! +${c.points_awarded}</span>`;
  } else if(status==='pending'){
    cardClass += ' pending';
    rightBtn = `<span class="status-chip" style="background:rgba(255,201,74,.15);color:var(--gold);">⏳ Esperando</span>`;
  } else if(status==='rejected'){
    cardClass += ' rejected';
    rightBtn = `<button class="check-btn" style="background:var(--coral);box-shadow:0 5px 0 var(--coral-dk);" onclick="submitTaskDone('${t.id}','${child.id}')">↻</button>`;
  } else {
    rightBtn = `<button class="check-btn" onclick="submitTaskDone('${t.id}','${child.id}')">✓</button>`;
  }
  return `
    <div class="${cardClass}">
      <div class="task-ic">${t.icon}</div>
      <div class="task-body">
        <div class="task-title">${escapeHtml(t.title)}</div>
        <div class="task-pts">+${t.points} 🪙</div>
      </div>
      <div class="task-actions">
        <button class="sound-btn" onclick="speakTaskById('${t.id}')">🔊</button>
        ${rightBtn}
      </div>
    </div>`;
}
function childRewardCard(r, child){
  const can = child.points >= r.cost;
  return `
    <div class="reward-card">
      <span class="reward-em">${r.icon}</span>
      <div class="reward-title">${escapeHtml(r.title)}</div>
      <div class="reward-cost">${r.cost} 🪙</div>
      <button class="btn ${can?'btn-gold':'btn-outline'} btn-sm btn-block" ${can?`onclick="confirmRedeem('${r.id}')"`:'disabled'}>Resgatar</button>
      <button class="sound-btn" style="margin:8px auto 0;" onclick="speakRewardById('${r.id}')">🔊</button>
    </div>`;
}
function renderChildDashboard(child){
  const myTasks = state.tasks.filter(t=> t.active && (t.child_id===null || t.child_id===child.id));
  const thresholdBase = child.streak_level===1 ? 3 : 5;
  const progressPct = child.streak_level===3 ? 100 : Math.min(100, Math.round((child.streak_days/thresholdBase)*100));
  const flameEmoji = child.streak_level===3 ? '🔥' : (child.streak_level===2 ? '🔥' : '🕯️');
  return `
    <div class="topbar">
      <div class="logo-wrap"><span style="font-size:30px;">${child.avatar}</span><div><div style="font-family:var(--font-display);font-size:16px;">${escapeHtml(child.name)}</div><div class="faint">Missão Família</div></div></div>
      <div class="row gap8">
        ${(state.deviceMode==='single' && state.children.length>1) ? `<button class="icon-btn" onclick="switchChild()">🔄</button>` : ''}
        ${state.deviceMode!=='single' ? `<button class="icon-btn" onclick="openDeviceSettings()">⚙️</button>` : ''}
        ${state.deviceMode==='single' ? `<button class="icon-btn" onclick="exitToRoleGate()">🚪</button>` : ''}
      </div>
    </div>
    <div class="screen">
      <div class="points-banner">
        <div class="row between">
          <div class="row gap10"><span class="coin">🪙</span><span class="points-num">${child.points}</span></div>
          <span class="pill" style="background:var(--card2);color:var(--gold);">nível ${child.streak_level}/3</span>
        </div>
        <div class="streak-row">
          <span class="flame ${child.streak_level===3?'lv3':''}">${flameEmoji}</span>
          <div class="streak-track"><div class="streak-fill" style="width:${progressPct}%"></div></div>
          <span class="faint" style="white-space:nowrap;">${child.streak_days}🔗</span>
        </div>
        ${child.streak_level===3 ? `<p class="faint" style="margin-top:8px;text-align:center;color:var(--gold);font-weight:800;">⚡ Bônus ativado: pontos x1,1 em toda tarefa!</p>` : ''}
      </div>

      <h2 class="section-title">📋 Minhas tarefas de hoje</h2>
      ${myTasks.length===0 ? emptyBox('🌈','Nenhuma tarefa hoje','Peça pro responsável criar uma!') : myTasks.map(t=>childTaskCard(t, child)).join('')}

      <h2 class="section-title">🎁 Loja de prêmios</h2>
      ${state.rewards.filter(r=>r.active).length===0 ? emptyBox('🎁','Loja vazia','Peça pro responsável adicionar prêmios!') : `<div class="reward-scroll">${state.rewards.filter(r=>r.active).map(r=>childRewardCard(r, child)).join('')}</div>`}

      ${renderMyPendingDeliveries(child)}
    </div>
  `;
}

// ============================================================
//  ROTEADOR PRINCIPAL
// ============================================================
function render(){
  const app = $('#app');
  if(state.loading){ app.innerHTML = renderLoading(); return; }
  switch(state.screen){
    case 'welcome': app.innerHTML = renderWelcome(); break;
    case 'create': app.innerHTML = renderCreateFamily(); break;
    case 'join': app.innerHTML = renderJoinFamily(); break;
    case 'addFirstChild': app.innerHTML = renderAddFirstChild(); break;
    case 'deviceMode': app.innerHTML = renderDeviceModeChoice(); break;
    case 'childDevicePick': app.innerHTML = renderChildDevicePick(); break;
    case 'roleGate': app.innerHTML = renderRoleGate(); break;
    case 'app': app.innerHTML = (state.role==='parent') ? renderParentApp() : renderChildApp(); break;
    default: app.innerHTML = renderWelcome();
  }
}

// ============================================================
//  BOOT
// ============================================================
async function boot(){
  const familyId = ls_get('mf_family_id');
  if(!familyId){ state.loading=false; state.screen='welcome'; render(); return; }
  state.loading = true; render();
  const fam = await fetchFamilyById(familyId);
  if(!fam){ ls_del('mf_family_id'); state.loading=false; state.screen='welcome'; render(); return; }
  state.family = fam;
  await loadFamilyData();
  setupRealtime();
  state.loading = false;
  decidePostFamilyFlow();
}
document.addEventListener('DOMContentLoaded', boot);
</script>


</html>
